services:
  postgres:
    image: postgres:16-alpine
    container_name: yaseetech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: yaseetech
      POSTGRES_PASSWORD: yaseetech_dev_password
      POSTGRES_DB: yaseetech
    ports:
      - "5432:5432"
    volumes:
      - yaseetech_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yaseetech -d yaseetech"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  yaseetech_pgdata:
